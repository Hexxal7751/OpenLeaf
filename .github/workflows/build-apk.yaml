name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android scaffold
        run: |
          flutter create --platforms=android --project-name openleaf --org com.openleaf /tmp/scaffold
          cp -r /tmp/scaffold/android ./android
          sed -i 's/android:label="[^"]*"/android:label="OpenLeaf"/' android/app/src/main/AndroidManifest.xml

      - name: Add R8 keep rules
        run: |
          test -f android/app/build.gradle.kts
          cat > android/app/proguard-rules.pro <<'EOF'
          -dontobfuscate
          -dontwarn com.google.mlkit.vision.text.chinese.**
          -dontwarn com.google.mlkit.vision.text.devanagari.**
          -dontwarn com.google.mlkit.vision.text.japanese.**
          -dontwarn com.google.mlkit.vision.text.korean.**
          -keep class com.google.mlkit.** { *; }
          -keep class com.google.android.gms.** { *; }
          -keep class biz.cunning.** { *; }
          EOF
          cat >> android/app/build.gradle.kts <<'EOF'

          android {
              buildTypes {
                  getByName("release") {
                      proguardFiles("proguard-rules.pro")
                  }
              }
          }
          EOF

      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk OpenLeaf.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OpenLeaf-apk
          path: OpenLeaf.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: OpenLeaf.apk
          generate_release_notes: true