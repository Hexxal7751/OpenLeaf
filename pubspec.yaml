name: openleaf
description: OpenLeaf - a free, offline document scanner and PDF toolkit. No paywalls.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cunning_document_scanner: ">=1.2.0 <2.0.0"
  google_mlkit_text_recognition: ">=0.13.0 <1.0.0"
  image: ^4.2.0
  path: ^1.9.0
  path_provider: ^2.1.4
  pdf: ^3.11.0
  share_plus: ">=10.0.0 <11.0.0"

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon_legacy.png
  adaptive_icon_background: "#0B0A24"
  adaptive_icon_foreground: assets/logo_foreground.png
